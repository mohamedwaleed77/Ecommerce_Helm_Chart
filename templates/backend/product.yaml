apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: product-pvc
  namespace: {{ .Values.backend.namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  namespace: {{ .Values.backend.namespace }}
  labels:
    app.kubernetes.io/name: product
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: product
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product
    spec:
      initContainers:
        - name: wait-for-mongodb
          image: busybox:1.28
          command: ['sh', '-c', 'until ping -c 1 mongodb-service.{{ .Values.database.namespace }}.svc.cluster.local ; do sleep 2; done']

      containers:
        - name: product
          image: {{ .Values.backend.product.image }}
          ports:
            - containerPort: {{ .Values.backend.product.port }}
          envFrom:
            - configMapRef:
                name: backend
            - secretRef:
                name: backend-secret
          volumeMounts:
            - mountPath: {{ .Values.backend.product.mountpath }}
              name: product-storage
      volumes:
        - name: product-storage
          persistentVolumeClaim:
            claimName: product-pvc
