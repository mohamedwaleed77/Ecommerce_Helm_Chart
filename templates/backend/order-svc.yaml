apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: {{ .Values.backend.namespace }}
  labels:
    app.kubernetes.io/name: order
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: {{ .Values.backend.order.port }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: order
