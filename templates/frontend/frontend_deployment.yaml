apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: {{ .Values.frontend.namespace }}

spec:
   replicas: 2
   selector:
     matchLabels:
         app: frontend
   template:
      metadata:
        labels:
           app: frontend
      spec:
        containers:
          - name: frontend
            image: {{ .Values.frontend.image }}
            imagePullPolicy: Always
            ports:
             - containerPort: {{ .Values.frontend.port }}
            envFrom:
              - configMapRef:
                 name: frontend-envs
            resources:
             limits:
               cpu: "500m"
               memory: "512Mi"
             requests:
               cpu: "250m"
               memory: "256Mi"


---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: {{ .Values.frontend.namespace }}

spec:
  type: ClusterIP
  selector: 
     app: frontend
  ports:
   - protocol: TCP
     port: 80
     targetPort:  {{ .Values.frontend.port }}

